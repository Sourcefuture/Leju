env:
  inference_env: sim
  platform_type: "5"
  which_arm: both
  eef_type: rq2f85
  control_mode: joint
  only_arm: true
  head_init: [0, 12]
  ros_rate: 10
  direct_to_wbc: false
  enable_action_interpolation: true
  control_rate: 100
  image_size: [640, 480]
  frame_alignment: false

inference:
  go_bag_path: null
  # LingBot-VLA-V2 runs as the external policy server in this repository.
  policy_type: client
  pretrained_path: null
  eval_episodes: 1
  max_episode_steps: 200
  task_prompt: "Sort the components into their target areas"
  async_inference: false
  rtc_lite_enabled: false
  rtc_full_enabled: false
